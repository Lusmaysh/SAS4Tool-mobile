name: Build Executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
          version: "latest"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller main.py --onefile --add-data "lib;lib" --hidden-import=win32api --hidden-import=win32con -n SAS4Tool

      - name: Compress with UPX
        run: |
          upx dist/SAS4Tool.exe --lzma --best --force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAS4Tool-Executable
          path: dist/SAS4Tool.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SAS4Tool.exe
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
